<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13151a">
<title>Multilevel Writing</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13151a;--panel:#1b1e25;--line:#2b303a;--text:#e8eaf0;--mute:#9199a8;--accent:#9fb0ff;--ok:#7fd6a4;--warn:#f0b86e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:500 16px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:18px;margin:0;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);background:var(--panel);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.timer.low{color:var(--warn)}
.steps{display:flex;gap:8px;margin-top:12px}
.step{flex:1;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;background:none;color:var(--mute);font:700 13px Manrope,sans-serif;cursor:pointer}
.step.on{border-color:var(--accent);color:var(--text);background:var(--panel)}
.step.done:not(.on){color:var(--ok)}
.part{margin:20px 0 6px;color:var(--mute);font-weight:700;font-size:14px}
.lead{font-weight:800;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.email{border-left:3px solid var(--accent);font:400 17px/1.6 Newsreader,Georgia,serif}
.email p{margin:0 0 8px}
.task{font:600 18px/1.55 Newsreader,Georgia,serif}
.hint{color:var(--mute);font-size:14px;margin-top:6px}
textarea,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font:400 17px/1.65 Newsreader,Georgia,serif}
textarea{min-height:260px;resize:vertical}
input{font:600 16px Manrope,sans-serif;padding:12px 14px;margin:6px 0 12px}
label{font-size:14px;color:var(--mute);font-weight:700}
textarea:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--warn);transition:width .2s,background .2s}
.bar.ok i{background:var(--ok)}
.nav{display:flex;gap:10px;margin:18px 0 40px}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:800 16px Manrope,sans-serif;cursor:pointer}
.btn.main{background:var(--accent);color:#13151a;border-color:var(--accent)}
.btn:disabled{opacity:.4}
.grid{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.chip{padding:14px 16px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:800 16px Manrope,sans-serif;cursor:pointer}
.sticky{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding:12px 0;margin:8px 0 0!important}
.chip.on{background:var(--accent);color:#13151a;border-color:var(--accent)}
.res h2{font-size:15px;color:var(--mute);margin:24px 0 0;font-weight:700}
.ans{white-space:pre-wrap;font:400 17px/1.65 Newsreader,Georgia,serif}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:10px}
.empty{color:var(--mute);font-style:italic}
.who{font-weight:800;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:380px;width:100%;margin:0}
.modal .nav{margin:16px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="row"><h1>Multilevel Writing</h1><div class="timer" id="timer" hidden>60:00</div></div>
  <div class="steps" id="steps"></div>
</header>
<main id="main"></main>
</div>
<div id="modal"></div>

<script>
const F="Write a letter to your friend. ", MIN=60;
const L=(rec,rest)=>[F+rest,"Write a letter to "+rec+". "+rest];
const SA="Write about your feelings and what the school administration should do about the situation.";
// m(intro, salutation, body[], sender, [task1.1, task1.2], topic, closing?)
const M=(a,b,c,d,e,f,g)=>({intro:a,email:[b,...c,...(g===""?[]:[g||"Best regards,"]),d],t11:e[0],t12:e[1],topic:f});
const MOCKS=[
M("You received an email from the online store.","Dear Customer,",["We are excited to inform you about our 11/11 sale! On 11th November, you can get 50% off on 3 products of your choice.","We would love to hear your thoughts about our website. Which products would you like to buy during the sale?","Your opinion is very important to us."],"The Online Store Team",["Write a letter to your friend who also shops at this store. Write about your feelings about the 11/11 sale and which products you plan to buy.","Write a letter to the store team. Write about your opinion of their website and your choice of products for the 11/11 sale. Explain why you like the website and why you want to buy these products."],"Should teenagers have part-time jobs while studying?"),
M("Your school has opened a Cinema Club. The school administration sent you an email.","Dear Student,",["We are excited to announce that our school has opened a Cinema Club! We would like to know your opinion about the best time for the movie screenings. Also, which movie would you like to see in the first session?","Your suggestions are very important to us."],"The School Administration",["Write a letter to a friend who also attends the school. Write about your feelings about the Cinema Club, which time you prefer for the screenings, and which movie you hope will be shown first.","Write a letter to the school administration. Write about your feelings about the Cinema Club. Explain why you prefer this time and movie."],"What problems are caused by the overuse of mobile phones, and how can these problems be solved?"),
M("Your literature teacher has sent you an email with a homework task.","Dear Student,",["For your literature homework, you are required to read one biography book within this month.","Please tell me which famous person's biography you would like to read. Do you know where you can find or buy the book?","I look forward to your reply."],"Your Literature Teacher",["Write a letter to your friend who is also in the same literature class. Write about your feelings about this homework, which person's biography you plan to read, and where you think you can get the book.","Write a letter to your literature teacher. Write about your feelings about the homework, the biography book you plan to read, and where you will get it."],"Do you agree that public transportation should be free for everyone?"),
M("You recently had a problem with your bank card. Your bank has sent you an email.","Dear Customer,",["We have been informed that you recently experienced a problem with your bank card.","Could you please tell us what kind of problem you faced?","What would you like us to do to help you solve this issue?","We are sorry for the inconvenience and appreciate your feedback."],"Customer Service Team, Hazina Bank",["Write a letter to your friend and tell them about the problem with your bank card. Explain how you felt about it and what you hope the bank will do.","Write a letter to the bank. Explain what problem you had with your bank card and what you would like the bank to do to fix it."],"What are the advantages and disadvantages of studying abroad?"),
M("Your school recently organized a cultural event called the Sumalak Festival. The school director sent you an email for your feedback.","Dear Student,",["Thank you for taking part in our recent Sumalak Festival. We hope you enjoyed the event.","We would like to know your opinion: What did you like about the event? What problems or weaknesses did you notice?","Your feedback will help us improve future events."],"The School Director",["Write a letter to your friend who also attended the Sumalak Festival. Write about what you enjoyed the most and what problems you noticed.","Write a letter to the school director. Explain what you liked about the event and what problems you noticed."],"Should school students wear school uniform?"),
M("You participated in a school program called “Our Hope”, which sponsors students to study at a foreign university. You have received an email from the program manager.","Dear Student,",["Congratulations! We are pleased to inform you that you are one of the winners of the “Our Hope” program.","Please tell us which country you would like to go to and which field of study you plan to pursue.","We look forward to your reply."],"The “Our Hope” program manager",["Write a letter to your friend who also participated in the program. Write about how you felt when you found out you won, which country you want to go to, and which field you want to study.","Write a letter to the program manager. Write about how happy you are to have won, which country you plan to go to, and which field you want to study. Explain briefly why you chose this country and field."],"What problems can air pollution cause, and what solutions could be implemented?"),
M("Recently, your school changed the menu in the school cafeteria. Many students are unhappy with the new menu. You have received an email from the school administration.","Dear Student,",["We have recently updated the menu in our school cafeteria.","We would like to know your opinion about the new menu. Which dishes or parts of it are you not satisfied with? What changes or improvements would you like to suggest?","Your feedback is very important to us."],"The School Administration",["Write a letter to your friend who also eats in the school cafeteria. Write about what you think of the new menu, which dishes you don't like, and what you would like to change.","Write a letter to the school administration. Write about what you liked and disliked about the new menu. Explain what specific changes you would suggest."],"Is it better for young people to live with their parents or independently?"),
M("Many students at your school are unhappy about the winter holiday which is 7 days long. The school director has sent you an email.","Dear Student,",["We have received feedback that some students feel the winter holiday was too short this year.","Could you please explain why you think the holiday was too short and how long you believe would be an appropriate duration?","Your opinion is very important to us."],"The School Director",["Write a letter to your friend who also studies at the school. Write about the feelings and what the school administration should do about the situation.","Write a letter to the school director. Write about the feelings and what the school administration should do about the situation."],"What are the advantages and disadvantages of online shopping?"),
M("You noticed some problems on your school's official Instagram page. The school administration sent you an email.","Dear Student,",["Thank you for your feedback about our official Instagram page.","Could you please tell us what shortcomings you noticed on the page? How can the page be improved to better engage students?","Your suggestions are very important to us."],"The School Administration",L("your school administration",SA),"Do you agree that animals should not be kept in zoos?"),
M("The city council plans to transform your city's main park into a Disney-themed park. They want to know your opinion about this.","Dear Resident,",["We are considering turning the city's main park into a Disney-themed park.","We would like to know your opinion about this idea.","What changes or improvements would you like to see in the park if this happens?","Your feedback is very important to us."],"The City Council",["Write a letter to your friend. Share your opinion about turning the park into a Disney-themed park and what you think should be done.","Write a letter to the city council. Explain your opinion about the plan, what changes you would suggest, and why."],"What problems are caused by increasing traffic, and how can these problems be reduced?"),
M("The City Council is planning to organize an Anti-Smoking Campaign to reduce smoking in the city.","Dear Resident,",["We are planning to launch an Anti-Smoking Campaign to help reduce smoking in our city.","Do you think this is a good idea? What kinds of activities or actions do you think would make the campaign effective?","Your feedback is very important to us."],"The City Council",["Write a letter to your friend. Share your opinion about the campaign and what activities you think would help it succeed.","Write a letter to the City Council. Explain whether you think the Anti-Smoking Campaign is a good idea and suggest what specific activities could make it more effective."],"Is it better to work for a company or be self-employed?"),
M("The history museum management sent you an email.","Dear Student,",["We are planning to make museum entry free for school students every Sunday.","We would like to know your opinion about this idea.","What else do you think the museum could do to attract more visitors?","Your suggestions are very important to us."],"The Museum Director",L("the museum director","Write about your feelings and what the museum administration should do about the situation."),"What are the advantages and disadvantages of doing sports regularly?"),
M("You recently volunteered in a food distribution project that provided supplies for low-income families. Unfortunately, many families did not receive enough food. Email from the Charity Organization:","Dear Volunteer,",["Thank you for helping with our recent food distribution project.","We heard that some families did not receive enough supplies.","Could you please tell us what problems you noticed during the project? What do you think we can do to make future distributions better organized?","Your feedback will help us improve our work."],"The Charity Team",["Write a letter to your friend. Explain what happened during the food distribution project, how you felt about it, and what you think should be improved next time.","Write a letter to the charity organization. Describe what problems you noticed during the project and suggest how they can improve future food distributions."],"Do you agree that technology makes people less social?"),
M("Your school is planning to organize a Sports Day. The School Administration sent you an email.","Dear Student,",["We are planning to organize a Sports Day for all students.","We would like to know your opinion about the event.","Which games or sports would you like to see included? How can we make the Sports Day fun and enjoyable for everyone?","Your feedback is very important to us."],"The School Administration",L("the school administration","Write about your feelings and what you think the school administration should do about the situation."),"What problems can stress cause, and how can people reduce it?"),
M("A famous news website recently published an article about your city, but it contains mistakes and unclear information. The editorial team wants to know your opinion and suggestions for improvement.","Dear Resident,",["We recently published an article about your city on our website.","We have received feedback that the article contains some mistakes and unclear information.","Could you please tell us your opinion about the article? What corrections or improvements would you suggest?","Your feedback is very important to us."],"The Editorial Team",L("the editorial team","Write about your feelings and what you think the editorial team should do about the situation."),"What are the advantages and disadvantages of working from home?"),
M("Your school website is preparing an article about managing pocket money. They sent you an email to get your opinion.","Dear Student,",["We are preparing an article about how students manage their pocket money.","We would like to know your opinion. How do you use your pocket money? Would you like some advice on how to spend it wisely and save effectively?","Your feedback will help us make the article more useful for students."],"The School Website Team",["Write a letter to your friend. Tell him/her how you use your pocket money and whether you would like some advice on saving or spending it wisely.","Write a letter to the School Website Team. Explain how you manage your pocket money, say if you would like advice on it."],"Do you agree that social media does more harm than good?"),
M("Your local council plans to plant flowers and other plants in your neighborhood to make it more beautiful. They sent you an email.","Dear Resident,",["We are planning to plant flowers and other plants in your neighborhood to make it more attractive and pleasant.","We would like to know your opinion. Which plants do you think should be planted? Would you be willing to help care for the plants as a volunteer?","Looking forward to your reply."],"The Local Council",["Write a letter to your friend. Tell him/her which plants you would like to see in your neighborhood and whether you would like to help take care of them.","Write a letter to the Local Council. Explain which plants you think would be suitable for the neighborhood and whether you would like to volunteer to help care for them."],"What problems can fast food create, and how can these problems be solved?"),
M("Your local government sent you an email.","Dear Resident,",["We are planning to build a new facility in your neighborhood and would like to get your feedback. There are three ways to give your opinion via SMS, email or commenting on official website.","Which method would you prefer to use to share your opinion?","What kind of facility do you think would benefit the community the most?","Your feedback is very important to us."],"Local government",L("the government address","Write about your feelings and what you think the local government should do about the situation."),"Is it better to travel alone or with others?"),
M("You called medical emergency service when your mother was ill. The emergency staff treated her, and now the hospital administration wants your opinion.","Dear Patient's Family,",["We hope your mother is feeling better now.","We would like to know your opinion about our medical services.","Were you satisfied with the treatment and care provided? What could be improved to make our services even better?","Your feedback is very important to us."],"Hospital administration",["Write a letter to your friend. Tell him/her about your feelings, and any suggestions for improvement.","Write a letter to the hospital administration. Tell them about your feelings, and any suggestions for improvement."],"What are the advantages and disadvantages of using public transport?","Yours sincerely,"),
M("You received an email from the local police department.","Dear Resident,",["We are conducting a survey about safety in our neighborhood.","We would like to know if you have witnessed any rule-breaking or criminal activities recently.","What measures do you think could help reduce such problems in the future?"],"Local Police Department",L("the local police","Write about your experience and what the police should do in this case."),"Do you agree that children should limit their screen time?"),
M("Your school magazine is preparing an article about phone addiction among students. They have sent you an email.","Dear Student,",["We are writing an article about mobile phone overuse among students.","We would like to know your opinion.","Do you think students around you spend too much time on their phones?","What should the school do to help students use their phones in a healthier way?","Your feedback will help us make the article more useful."],"The School Magazine Team",["Write a letter to your friend. Write about your feelings and what the school should do to help.","Write a letter to the School Magazine Team. Write about your feelings and what the school should do to help."],"What problems can plastic pollution cause, and how can it be solved?"),
M("The city is planning to organize a running marathon called ‘My Health’. You have received an email from the City Sports Department.","Dear Resident,",["We are planning to hold a running event called the ‘My Health’ Marathon to promote a healthy lifestyle in our city.","We would like to know what you think about this idea.","When do you think would be the best time to organize the marathon?","Your feedback is very important to us."],"City Sports Department",["Write a letter to your friend. Writing about your feelings and what sport department should do about the situation.","Write a letter to the City Sports Department. Writing about your feelings and what sport department should do about the situation."],"Is it better to read paper books or e-books?"),
M("Your local council is planning to build a new sports complex in your neighborhood. They have sent you an email.","Dear Resident,",["We are writing to ask for your opinion about the new sports complex planned for your area.","We would like to know:","Do you think a sports complex is necessary for your neighborhood?","What kinds of sports facilities would you like to have in it?","Your answers will help us plan the project better."],"Local Council",["Write a letter to your friend. Write about your feelings and what kinds of sports facilities you would like the new complex to have.","Write a letter to the Local Council. Write about your feelings and explain which sports facilities the complex should include and why."],"What are the advantages and disadvantages of having pets at home?"),
M("Your school is planning a holiday trip to one of the historical cities of Uzbekistan. They have sent you an email.","Dear Student,",["During the upcoming holiday, our school is considering organising a trip to one of Uzbekistan’s historical cities.","We would like to know your opinion.","What do you think about going on a trip with your classmates?","Which city would you recommend for this school trip?","Your suggestions will help us choose the best destination."],"The School Trip Committee",["Write a letter to your friend. Tell him/her how you feel about the school trip and which city you want to visit.","Write a letter to the School Trip Committee. Tell them your opinion about travelling with classmates and recommend a city to visit."],"Do you agree that schools should start later in the morning?"),
M("Tourism committee is preparing for the upcoming Khiva Melon Festival, where a group of tourists from the USA will attend. They need a translator for three days and you applied for the position. They have now sent you an email.","Dear Applicant,",["Thank you for applying for the translator position during the Khiva Melon Festival.","We would like to know a bit more before making our final decision.","Do you have enough time to work for all three days of the festival?","Why do you think we should choose you for this job?"],"Khiva Tourism Committee",["Write a letter to your friend. Tell him/her about the email you received, whether you have time to work for three days, and why you think you may get the job.","Write a letter to the Tourism Committee. Tell them if you are available for the three days and explain why you are suitable for the position."],"What problems can water shortages cause, and what solutions can be applied?"),
M("Your local council is considering demolishing the old ‘Dehqon’ market in the city centre and building a modern shopping mall instead. They want to know the residents’ opinion.","Dear Resident,",["We are considering redeveloping the city centre by replacing the old ‘Dehqon’ market with a modern shopping mall.","We would like to know your opinion:","Do you often use the farmers’ market?","What do you think about this redevelopment project?","Your feedback will help us make the best decision for the community."],"Local Council",["Write a letter to your friend. Tell him whether you use the farmers’ market and your feelings about the new project.","Write a letter to the Local Council. Tell them whether you use the farmers’ market and your feelings about the new project."],"Is it better to spend free time alone or with friends?"),
M("Your school magazine is preparing an article about students’ favorite songs. They sent you an email to get your opinion.","Dear Student,",["We are preparing an article about students’ favorite songs and music habits.","We would like to know your opinion:","What type of songs do you like to listen to the most?","Which mobile apps do you use to listen to music?"],"School Magazine Team",["Write a letter to your friend. Tell him/her what type of songs you like and which apps you use to listen to music.","Write a letter to the School Magazine Team. Explain your favorite types of songs, which music apps you use."],"What are the advantages and disadvantages of online education?"),
M("Your city library is planning to translate a biography of a famous successful person. They sent you an email to get your opinion.","Dear Reader,",["We are planning to translate a biography of a famous successful person into Uzbek language.","We would like to know your opinion:","Whose biography would you like us to translate?","What lessons or knowledge would you like to learn from this biography?","Your feedback will help us choose a book that is interesting and useful for readers."],"City Library Team",["Write a letter to your friend. Tell him/her whose biography you would like the library to translate and what you hope to learn from it.","Write a letter to the City Library Team. Explain whose biography you would like them to translate and what lessons or knowledge you hope to gain from it."],"Do you agree that students should learn a musical instrument at school?"),
M("Your school is inviting students to participate in a small business project. They have sent you an email to get your opinion.","Dear Student,",["We are excited to offer students the opportunity to take part in a small business project at our school.","We would like to know your opinion:","Which type of business project would you like to do?","What benefits do you hope to gain from this project?","Your feedback will help us design projects that are interesting and useful for students."],"School Administration",["Write a letter to your friend. Tell him/her which business project you would like to do and what benefits you hope to gain.","Write a letter to the School Administration. Explain which business project you would like to do and what benefits you hope to gain."],"What problems can unemployment cause, and how can the government solve them?"),
M("Your university is planning to introduce a new language course for students next semester. They have sent you an email to get your opinion.","Dear Student,",["We are planning to add a new foreign language course to the university curriculum next semester.","We would like to know your opinion:","Which language would you like to study?","Why do you want to learn this language?","Your feedback will help us choose the most useful language for students."],"University Academic Committee",["Write a letter to your friend. Write about your opinion and what university administration should do.","Write a letter to university academic committee. Write about your opinion and what university administration should do."],"Is it better to spend money on experiences or possessions?"),
M("You are taking part in a survey about students’ future goals. You received an email asking for your opinion.","Dear Student,",["We are conducting a survey about young people’s dreams and future plans.","We would like to know your opinion:","What is your main goal for the next five years?","What steps do you plan to take to achieve this goal?","Your feedback will help us understand students’ ambitions better."],"The Future Goals Survey Team",["Write a letter to your friend. Tell him/her what your main goal for the next five years is and what steps you want to take to achieve it.","Write a letter to the survey team. Explain what your main goal for the next five years is and describe the actions you plan to take to reach it."],"What are the advantages and disadvantages of learning a foreign language at an early age?"),
M("You are living in a shared room in your university dormitory. You wrote a letter to the dormitory manager asking to change your room. Now you have received an email with some questions.","Dear Student,",["We received your request about changing your dormitory room. To consider your application, we would like to know the following:","Why do you want to change your current room?","What kind of room would you prefer to move into?","Your answers will help us review your situation."],"Dormitory Manager",["Write a letter to your friend. Tell him/her why you want to change your room and what type of room you want to move into.","Write a letter to the dormitory manager. Explain the problems with your current room and describe what kind of room you would like to have instead."],"Do you agree that university education should be free for everyone?"),
M("Your school is planning to introduce a new rule about using mobile phones and headphones during lessons. They sent you an email asking your opinion.","Dear Student,",["We are planning to introduce a rule that students are not allowed to use mobile phones or headphones during lessons.","We would like to know your opinion:","Do you agree with this rule?","What could school do to help students follow this rule effectively?","Your feedback will help us create a better learning environment."],"School Administration",["Write a letter to your friend. Write about your feelings and how you think it could be followed.","Write a letter to the school administration. Write about your feelings and how you think it could be followed."],"What problems can noise pollution cause, and what measures can reduce it?"),
M("You are studying at a high school. You received an email from your school trip organizer.","Dear Student,",["We are planning to organize a school trip next month, and we would love to hear your ideas. Could you suggest where we should go? (for example: camping, mountains, seaside, museum, amusement park).","Please also tell us what activities you would like to do there and what problems we should avoid.","Your feedback will help us plan an enjoyable trip for everyone."],"The School Trip Organizer",["Write a letter to your friend who is also going on the trip. Write about your feelings and discuss what place and activities you would like to choose. Should it last one day or two days?","Write a letter to the teacher. Write about feelings and suggest where the trip should go, and mention what activities should be included or what problems should be avoided."],"Is it better to spend holidays abroad or in your own country?",""),
M("Your school is planning to introduce a new course that teaches one practical future profession (for example: hairdressing, plumbing, SMM). They have sent you an email to get your opinion.","Dear Student,",["We are planning to add a new course (like hairdressing, plumbing, sewing) that teaches a practical profession which may help students in the future.","We would like to know your opinion:","Do you agree with this idea?","Which profession do you think we should teach?","Your feedback will help us choose the most useful course for students."],"School Administration",["Write a letter to your friend. Tell him/her whether you agree with this idea and which profession you think the school should teach.","Write a letter to the School Administration. Say whether you agree with adding such a course and recommend which profession the school should teach."],"What are the advantages and disadvantages of team sports?"),
M("You have received an email.","Dear Resident,",["Our local council is planning to start a campaign to reduce water waste in our community. We would like to know your opinion on the issue.","Where do you think people waste the most water?","What should we do to encourage them to change their habits?"],"Local council",["Write to your friend. Write about your opinion and what local council should do about the situation.","Write to the local council. Write about your opinion and what local council should do about the situation."],"Do you agree that people should reduce meat consumption to protect the environment?"),
M("Your university is starting a campaign to promote healthy eating among students. They sent you an email to get your opinion.","Dear Student,",["We are planning a Healthy Eating Campaign at our school.","Please tell us:","What unhealthy eating habits do students often have?","What should we do to encourage them to eat healthier?"],"School Health Committee",["Write to your friend. Write about your opinion and what school health committee should do about the situation.","Write to the committee. Write about your opinion and what school health committee should do about the situation."],"What problems are caused by too much screen time, and how can they be solved?"),
M("You received an email from your history teacher. For the next lesson, you need to prepare a presentation about an ancient period or dynasty.","Dear Student,",["For our next history lesson, please prepare a presentation about one ancient period or dynasty.","We would like to know:","Which period or dynasty have you chosen?","Why do you think this period will be interesting for your classmates?","Your answer will help us guide the lesson better."],"Your History Teacher",["Write a letter to your friend. Tell him/her which period or dynasty you chose and why you think it will be interesting for classmates.","Write a letter to your teacher. Explain which period or dynasty you have chosen and why. Include what aspects of this period you plan to present and why they will be engaging for the class."],"Is it better to plan your daily activities or to be flexible?"),
M("Your school is planning to create a new club to help students spend their free time in an enjoyable and useful way. They have sent you an email.","Dear Student,",["We are planning to start a new club (like dance, music…) at our school to help students spend their free time more productively.","We would like to know your opinion:","What kind of club would you like us to create?","Why do you think this club would be useful for students?","Your feedback will help us choose the best club for our school."],"School Administration",["Write a letter to your friend. Tell him/her what club you want the school to create and why it would be useful.","Write a letter to the School Administration. Explain what club you prefer and why it would benefit students."],"What are the advantages and disadvantages of living alone?"),
M("Your local council sent you an email:","Dear Resident,",["Our neighborhood committee plans to open an official social media page (Telegram, Instagram, etc.) to share updates about local events and activities.","We would like your opinion.","Which platform would be best for our neighborhood?","What topics or information should we post to be useful for residents?","Your suggestions will help us create a helpful page.","Thank you for your time."],"The Neighborhood Committee",["Write an email to your friend about this new idea. Write about your feelings and how the social pages can be useful for the residents.","Write an email to the neighborhood committee. Write about your feelings and how the social pages can be useful for the residents."],"Do you agree that students should do more physical activities at school?"),
M("Your company manager has sent you an email after you complained about receiving a lower salary than expected.","Dear Employee,",["We have received your message about the salary issue.","We would like to understand the situation clearly.","Could you please explain the problem in detail?","What would you like us to do to solve this issue?","Your response will help us handle the matter correctly."],"Management Team",["Write a letter to your friend. Explain what is the problem with your salary and what you want the company to do.","Write a letter to the Management Team. Clearly describe the salary problem and tell them what you want them to do to fix it."],"What problems can overpopulation cause, and what solutions are possible?"),
M("Your local council has replied to your complaint about the growing number of stray dogs (daydi, qarovsiz itlar) in your neighborhood. They sent you an email.","Dear Resident,",["We have received your message about the stray dog problem in your area.","We would like to understand the situation more clearly.","Could you please explain the problem in more detail?","What actions would you like us to take to solve this issue?","Your information will help us handle the situation properly."],"Local Council",["Write a letter to your friend. Explain the problem with stray dogs in your neighborhood and what actions you want the council to take.","Write a letter to the Local Council. Clearly describe the stray dog problem and explain what actions you want them to take."],"Is it better to communicate by phone or face-to-face?"),
M("Your local council is planning to improve the city’s transport system. They sent you an email to get your opinion.","Dear Resident,",["We are planning to improve the city’s transport system.","We would like to know your opinion:","Which new transport service would you like to see introduced, or which existing service should be improved?","What positive changes do you think these improvements will bring to the city?","Your feedback is very important to us."],"Local Council",["Write a letter to your friend. Tell him/her what transport service you would like to see improved or introduced, and what positive changes it will bring.","Write a letter to the Local Council. Explain which transport service you prefer to improve or introduce, and describe the benefits it would bring to the city and its residents."],"What are the advantages and disadvantages of using social media for education?"),
M("Your university is planning to create a new app that would be useful for people. They have sent you an email to get your opinion.","Dear Student,",["We are planning to develop a new app that can benefit people in their daily lives.","We would like to know your opinion:","What kind of app would you suggest we create?","How would this app be helpful for people?","Your feedback will help us design an app that is practical and useful."],"University Development Team",["Write a letter to your friend. Explain what kind of app you would suggest and why you think it would be useful.","Write a letter to the University Development Team. Explain what app you would like them to create and describe how it would benefit people."],"Do you agree that art and music are essential subjects at school?"),
M("Your university is researching current trends among young people. They sent you an email.","Dear Student,",["We are studying new trends among young people, especially those related to a healthy lifestyle.","We would like to know your opinion:","What healthy lifestyle trends are currently popular among young people?","Which healthy habits do you personally follow?","Your feedback will help us understand what motivates students to stay healthy."],"University Research Team",["Write a letter to your friend. Tell him/her about the healthy lifestyle trends among young people and what healthy habits you follow.","Write a letter to the University Research Team. Explain what healthy lifestyle trends are popular among young people and describe your own healthy habits."],"What problems can food waste create, and how can society reduce it?"),
M("You are a member of a local sports center. The administration has noticed some issues and sent you an email to get your opinion.","Dear Member,",["We have received feedback that there may be some problems at our sports center.","We would like to know your opinion:","What issues have you noticed at the sports center?","What measures would you suggest to attract more people and make the center better?","Your feedback is very important to us."],"Sports Center Administration",["Write a letter to a friend. Explain what problems you’ve noticed at the sports center and what changes you think could help attract more members.","Write a letter to the Sports Center Administration. Explain clearly what problems you have noticed and suggest specific measures that could improve the center and attract more people."],"Is it better to buy a home or rent one?"),
M("You have applied for a U.S. visa and submitted your documents to the embassy. You have now received an email from the U.S. Embassy.","Dear Applicant,",["We have received your visa application and would like to clarify a few details before processing it.","Please tell us:","What is the purpose of your visit to the United States?","Where will you stay during your visit?","Your answers will help us continue the visa procedure."],"U.S. Embassy Visa Section",["Write a letter to your friend. Tell him/her why you want to go to the U.S. and where you plan to stay.","Write a letter to the U.S. Embassy. Explain clearly why you want to visit the United States and where you will stay during your trip."],"What are the advantages and disadvantages of using bicycles in cities?"),
M("You want to resign from your current job. You sent a resignation letter to your manager, and they replied to you.","Dear Employee,",["We have received your resignation notice.","We would like to understand your situation better:","Why do you want to leave your job?","Under what circumstances would you continue working with us?","Your reply will help us improve work conditions and support our employees."],"Management Team",["Write a letter to your friend. Explain why you want to leave your job and what changes would make you stay.","Write a letter to the manager. Clearly explain why you want to resign and describe what conditions would allow you to continue working."],"Do you agree that teenagers should learn how to manage money?"),
M("You are a regular customer of an online shopping website like uzum.uz. The website sent you an email asking for your opinion.","Dear Customer,",["We are always trying to improve our service and make your shopping experience better.","We would like to know:","Are you satisfied with our service?","What changes or improvements would you like to see in the future?","Your feedback is very important to us."],"The Online Shopping Team",["Write a letter to your friend. Tell him/her your opinion about the website and suggest what could be improved.","Write a letter to the Online Shopping Team. Explain your opinion about the service, mention what you like, and suggest any improvements."],"What problems can climate change cause, and how can we address them?"),
M("You received this email from music club coordinator in your school:","Dear Member,",["We plan to introduce a new activity for our Music Club next month and would like your suggestions. What musical activity do you think most members would enjoy? Should it focus on learning, performing, or simply enjoying music together? Would you like to take part, and in what way?","Your ideas will help us plan a fun and meaningful event."],"Music Club Coordinator",["Write a short email to your friend in the club. Say which activity you want the club to try and whether you want to join it.","Write an email to the club coordinator. Explain what type of musical activity the club should offer and whether it should be focused on learning, performing, or enjoying music, giving your reasons. Mention if you want to participate and how."],"Is it better to spend free time being productive or relaxing?")
];

const TASKS=m=>[
 {label:"Task 1.1",part:"Part 1",email:1,min:40,max:60,target:"about 50 words",q:m.t11},
 {label:"Task 1.2",part:"Part 1",email:1,min:120,max:150,target:"120–150 words",q:m.t12},
 {label:"Part 2",part:"Part 2",min:180,max:200,target:"180–200 words",intro:"You are participating in an online discussion for language learners. The question is:",topic:"“"+m.topic+"”",q:"Post your response, giving reasons and examples."}];

const KEY="mlw2";
let st={phase:"start",mock:0,first:"",last:"",i:0,ans:["","",""],left:MIN*60,date:""};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ans)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

// in-page confirm (browser confirm() is blocked in some viewers)
function ask(msg,yes,label){
  $("modal").innerHTML=`<div class="modal"><div class="card"><div class="task" style="font-size:17px">${msg}</div><div class="nav"><button class="btn" id="mn">Cancel</button><button class="btn main" id="my">${label||"Yes"}</button></div></div></div>`;
  $("mn").onclick=()=>$("modal").innerHTML="";
  $("my").onclick=()=>{$("modal").innerHTML="";yes()};
}

setInterval(()=>{
  if(st.phase!=="test")return;
  if(!st.end)st.end=Date.now()+st.left*1000;
  st.left=Math.max(0,Math.ceil((st.end-Date.now())/1000));save();
  $("timer").textContent=fmt(st.left);
  $("timer").classList.toggle("low",st.left<300);
  if(st.left<=0)finish(true);
},1000);

function view(){
  $("timer").hidden=st.phase!=="test";
  if(st.phase!=="test")$("steps").innerHTML="";
  ({start,test,done:results})[st.phase]();
}

function start(){
  let h=`<div class="part">Enter your name</div><label>First name</label><input id="fn" value="${esc(st.first)}" autocomplete="given-name"><label>Last name</label><input id="ln" value="${esc(st.last)}" autocomplete="family-name">
  <div class="part">Choose a mock</div><div class="grid">${MOCKS.map((_,i)=>`<button class="chip ${i===st.mock?"on":""}" data-i="${i}">Mock ${i+1}</button>`).join("")}</div>
  <div class="hint">60 minutes · Part 1 (Task 1.1 and 1.2) and Part 2</div>
  <div class="nav sticky"><button class="btn main" id="go" disabled>Start Mock <span id="mn2"></span></button></div>`;
  $("main").innerHTML=h;
  const chk=()=>{st.first=$("fn").value;st.last=$("ln").value;$("go").disabled=!(st.first.trim()&&st.last.trim());$("mn2").textContent=st.mock+1;save()};
  $("fn").oninput=$("ln").oninput=chk;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.mock=+b.dataset.i;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));chk()});
  chk();
  $("go").onclick=()=>{st.phase="test";st.i=0;st.ans=["","",""];st.left=MIN*60;st.end=Date.now()+MIN*60000;st.timeup=false;st.date=new Date().toLocaleString();save();view();scrollTo(0,0)};
}

function test(){
  const m=MOCKS[st.mock],T=TASKS(m),t=T[st.i],last=st.i===2;
  $("timer").textContent=fmt(st.left);
  $("steps").innerHTML=T.map((x,i)=>`<button class="step ${i===st.i?"on":""} ${words(st.ans[i])?"done":""}" data-i="${i}">${x.label}</button>`).join("");
  $("steps").querySelectorAll(".step").forEach(b=>b.onclick=()=>{st.i=+b.dataset.i;save();view()});
  let h=`<div class="part">Mock ${st.mock+1} · ${t.part}</div>`;
  if(t.email)h+=`<p class="lead">${m.intro}</p><div class="card email">${m.email.map(p=>`<p>${p}</p>`).join("")}</div>`;
  h+=`<div class="card"><div class="task">${t.intro?t.intro+" <b>"+t.topic+"</b> ":""}${t.q}</div><div class="hint">Write ${t.target}.</div></div>
  <textarea id="box" placeholder="Start writing here…" spellcheck="false">${esc(st.ans[st.i])}</textarea>
  <div class="count"><span id="wc"></span><span>Target: ${t.target}</span></div><div class="bar" id="bar"><i></i></div>
  <div class="nav"><button class="btn" id="prev" ${st.i===0?"disabled":""}>Back</button><button class="btn main" id="next">${last?"Finish":"Next"}</button></div>`;
  $("main").innerHTML=h;
  const box=$("box"),upd=()=>{const n=words(box.value);$("wc").textContent=n+" words";$("bar").classList.toggle("ok",n>=t.min&&n<=t.max);$("bar").firstElementChild.style.width=Math.min(100,n/t.max*100)+"%"};
  box.oninput=()=>{st.ans[st.i]=box.value;save();upd()};upd();
  $("prev").onclick=()=>{st.i--;save();view();scrollTo(0,0)};
  $("next").onclick=()=>last?ask("Finish the test and see your answers?",finish,"Finish"):(st.i++,save(),view(),scrollTo(0,0));
}

function finish(auto){$("modal").innerHTML="";st.phase="done";if(auto===true)st.timeup=true;save();view();scrollTo(0,0)}

function results(){
  const m=MOCKS[st.mock],T=TASKS(m);
  let h=`<div class="part">Result</div><div class="who">${esc(st.first)} ${esc(st.last)}</div><div class="hint">Mock ${st.mock+1} · ${esc(st.date)}</div>${st.timeup?`<div class="hint" style="color:var(--warn)">Time is up — the test finished automatically.</div>`:""}`;
  T.forEach((t,i)=>{
    const a=st.ans[i],n=words(a);
    h+=`<div class="res"><h2>${t.label}</h2><div class="card">${t.email?`<div class="hint" style="margin:0 0 6px">${m.intro}</div>`:""}<div class="task">${t.intro?t.intro+" <b>"+t.topic+"</b> ":""}${t.q}</div></div>
    <div class="card">${a.trim()?`<div class="ans">${esc(a)}</div>`:`<div class="empty">No answer written.</div>`}<div class="meta"><span>${n} words</span><span>Target: ${t.target}</span></div></div></div>`;
  });
  h+=`<div class="nav"><button class="btn" id="copy">Copy all</button><button class="btn main" id="again">New test</button></div>`;
  $("main").innerHTML=h;
  $("copy").onclick=async()=>{
    const txt=`${st.first} ${st.last} — Mock ${st.mock+1}\n\n`+T.map((t,i)=>`${t.label}\n${t.intro?t.intro+" "+t.topic+" ":""}${t.q}\n\n${st.ans[i]}`).join("\n\n———\n\n");
    try{await navigator.clipboard.writeText(txt);$("copy").textContent="Copied"}catch(e){$("copy").textContent="Copy failed"}
  };
  $("again").onclick=()=>{st.phase="start";save();view();scrollTo(0,0)};
}
if(st.phase==="test"&&st.end&&Date.now()>=st.end){st.phase="done";st.timeup=true;save()}
view();
</script>
</body>
</html>
